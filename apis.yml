name: Synphony
description: >-
  Synphony builds and deploys robots that work in the real world, combining AI,
  robotics, and human-in-the-loop systems so machines can perform practical
  physical tasks across agriculture, assembly, and inspection. Its platform
  trains AI models on real-world data, tests robot performance in realistic
  scenarios, and deploys systems into production. The company's first
  application is autonomous strawberry-harvesting robots plus farm software
  services (bed-level analytics, data-pipeline integration, and agentic
  solutions), targeting California's roughly $3B strawberry industry where labor
  is about 60% of costs. Founded in 2025 and backed by Y Combinator (Spring
  2026), Synphony runs a customer-facing platform at app.synphony.co but
  publishes no public developer API, OpenAPI, or SDK at this time.
